plugins {
    id 'application'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.example'
version = '1.0.0'

sonar {
    properties {
        property 'sonar.projectKey', 'sonar-gradle'
        property 'sonar.projectName', 'sonar-gradle'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.example.App'
}

tasks.named('test') {
    useJUnitPlatform()
}
